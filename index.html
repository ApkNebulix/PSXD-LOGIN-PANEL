<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSXD ULTIMATE PRO ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap');
        
        :root {
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', 'Hind Siliguri', sans-serif;
            background: radial-gradient(circle at top left, #1e293b, #0f172a, #020617);
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
        }

        .premium-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.6));
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .premium-card:hover {
            transform: translateY(-8px);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .lifetime-glow {
            border-color: rgba(245, 158, 11, 0.5) !important;
            box-shadow: inset 0 0 20px rgba(245, 158, 11, 0.05);
        }

        .btn-gradient {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: 0.3s;
        }

        .btn-gradient:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .loader-ring {
            width: 50px; height: 50px;
            border: 4px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .copy-success { animation: bounceIn 0.5s; color: #10b981 !important; }
    </style>
</head>
<body class="p-0 m-0">

    <!-- LOGIN OVERLAY -->
    <div id="loginPage" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#020617] p-4 hidden">
        <div class="glass-panel p-8 w-full max-w-md animate__animated animate__fadeIn">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-2xl">
                    <i class="fas fa-shield-halved text-4xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Admin Portal</h1>
                <p class="text-slate-400 mt-2">আপনার সিকিউরড অ্যাক্সেস ভেরিফাই করুন</p>
            </div>
            <div class="space-y-5">
                <div class="relative">
                    <i class="fas fa-envelope absolute left-4 top-4 text-slate-500"></i>
                    <input type="email" id="emailInput" class="w-full bg-slate-900/50 border border-slate-700 p-4 pl-12 rounded-2xl outline-none focus:border-blue-500 transition" placeholder="Admin Email">
                </div>
                <div class="relative">
                    <i class="fas fa-key absolute left-4 top-4 text-slate-500"></i>
                    <input type="password" id="passInput" class="w-full bg-slate-900/50 border border-slate-700 p-4 pl-12 rounded-2xl outline-none focus:border-blue-500 transition" placeholder="Password">
                </div>
                <button onclick="handleAuth()" class="w-full btn-gradient py-4 rounded-2xl font-bold text-lg shadow-xl shadow-blue-500/20 active:scale-95">Verify & Login</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="mainApp" class="max-w-6xl mx-auto p-4 md:p-8 hidden">
        
        <!-- Navbar -->
        <header class="flex justify-between items-center mb-10 animate__animated animate__fadeInDown">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 glass-panel flex items-center justify-center overflow-hidden">
                    <img id="appLogo" src="" class="w-full h-full object-cover">
                </div>
                <div>
                    <h2 id="appTitle" class="text-xl font-bold text-white leading-none">Dashboard</h2>
                    <span class="text-xs text-blue-400 font-bold tracking-widest uppercase">Premium Controller</span>
                </div>
            </div>
            <button onclick="logout()" class="p-3 bg-red-500/10 text-red-500 rounded-2xl hover:bg-red-500 transition">
                <i class="fas fa-power-off"></i>
            </button>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
            <div class="glass-panel p-5 text-center">
                <p class="text-xs font-bold text-slate-500 uppercase">Total Users</p>
                <h3 id="statTotal" class="text-3xl font-bold mt-1">0</h3>
            </div>
            <div class="glass-panel p-5 text-center">
                <p class="text-xs font-bold text-emerald-500 uppercase">Active</p>
                <h3 id="statActive" class="text-3xl font-bold mt-1">0</h3>
            </div>
            <div class="glass-panel p-5 text-center">
                <p class="text-xs font-bold text-amber-500 uppercase">Lifetime</p>
                <h3 id="statLife" class="text-3xl font-bold mt-1">0</h3>
            </div>
            <div class="glass-panel p-5 text-center">
                <p class="text-xs font-bold text-red-500 uppercase">Blocked</p>
                <h3 id="statBlock" class="text-3xl font-bold mt-1">0</h3>
            </div>
        </div>

        <!-- Controls Area -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-8">
            <div class="relative w-full md:w-96">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="searchBox" onkeyup="filterCards()" class="w-full glass-panel py-3 pl-12 pr-4 outline-none focus:border-blue-500" placeholder="Search Device ID or Key...">
            </div>
            <div class="flex w-full md:w-auto gap-3">
                <button onclick="switchView('config')" class="flex-1 md:flex-none p-3 glass-panel hover:bg-slate-800 transition"><i class="fas fa-sliders mr-2"></i> Config</button>
                <button onclick="openEditor()" class="flex-1 md:flex-none btn-gradient px-6 py-3 rounded-2xl font-bold flex items-center justify-center gap-2"><i class="fas fa-plus"></i> New User</button>
            </div>
        </div>

        <!-- Cards Display Area -->
        <div id="userGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate__animated animate__fadeInUp">
            <!-- Dynamic Cards Here -->
        </div>

    </div>

    <!-- MODAL: USER EDITOR -->
    <div id="userModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="glass-panel w-full max-w-lg p-8 animate__animated animate__zoomIn">
            <h2 id="modalTitle" class="text-2xl font-bold mb-8">Edit User Intelligence</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="text-xs font-bold text-slate-500 ml-1">DEVICE IDENTITY</label>
                        <input id="m_device" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl outline-none uppercase font-mono mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 ml-1">STATUS</label>
                        <select id="m_status" onchange="checkStatus()" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl outline-none mt-1">
                            <option value="active">Active</option>
                            <option value="lifetime">Lifetime</option>
                            <option value="blocked">Blocked</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 ml-1">EXPIRY DATE</label>
                        <input type="date" id="m_expiry" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl outline-none mt-1">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 ml-1">LICENSE KEY</label>
                    <input id="m_key" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl outline-none font-mono mt-1">
                </div>
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="closeModal()" class="flex-1 p-4 rounded-2xl font-bold bg-slate-800 hover:bg-slate-700 transition">Cancel</button>
                <button onclick="processSave()" class="flex-1 btn-gradient p-4 rounded-2xl font-bold">Save Data</button>
            </div>
        </div>
    </div>

    <!-- MODAL: GLOBAL CONFIG -->
    <div id="configModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="glass-panel w-full max-w-2xl p-8 overflow-y-auto max-h-[90vh]">
            <h2 class="text-2xl font-bold mb-8 flex items-center gap-3"><i class="fas fa-cogs text-blue-500"></i> Advanced System Settings</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <h4 class="font-bold text-blue-400 border-b border-slate-700 pb-2">App Config</h4>
                    <div><label class="text-[10px] font-bold">APP TITLE</label><input id="c_title" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 mt-1"></div>
                    <div><label class="text-[10px] font-bold">LOGO URL</label><input id="c_logo" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 mt-1"></div>
                    <div><label class="text-[10px] font-bold">BUY URL (TELEGRAM)</label><input id="c_buy" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 mt-1"></div>
                </div>
                <div class="space-y-4">
                    <h4 class="font-bold text-emerald-400 border-b border-slate-700 pb-2">Global Config</h4>
                    <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-xl">
                        <span class="text-sm font-bold">Global Access Switch</span>
                        <input type="checkbox" id="c_global_on" class="w-6 h-6 rounded-md accent-blue-500">
                    </div>
                    <div><label class="text-[10px] font-bold">GLOBAL FREE KEY</label><input id="c_global_key" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 mt-1"></div>
                    <div><label class="text-[10px] font-bold">GLOBAL INSTRUCTION</label><textarea id="c_global_msg" rows="3" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 mt-1"></textarea></div>
                </div>
            </div>
            <div class="flex gap-4 mt-10">
                <button onclick="switchView('close')" class="flex-1 p-4 rounded-2xl bg-slate-800 font-bold">Close</button>
                <button onclick="saveConfigs()" class="flex-2 btn-gradient p-4 rounded-2xl font-bold">Apply Changes</button>
            </div>
        </div>
    </div>

    <script>
        // --- APP CONFIG ---
        const DATABASE_URL = "https://onedevicekeysxd-default-rtdb.firebaseio.com/psxd_loginkey_onedevice.json";
        const ADMIN_CRED = { email: "admin@psxd.com", pass: "shimulxd" }; // Change as needed

        let store = null;
        let editingIndex = -1;

        // AUTH SYSTEM
        window.onload = () => {
            if(localStorage.getItem('isLoggedIn') === 'true') {
                showApp();
            } else {
                document.getElementById('loginPage').classList.remove('hidden');
            }
        };

        function handleAuth() {
            const e = document.getElementById('emailInput').value;
            const p = document.getElementById('passInput').value;
            if(e === ADMIN_CRED.email && p === ADMIN_CRED.pass) {
                localStorage.setItem('isLoggedIn', 'true');
                showApp();
            } else {
                Swal.fire({ icon: 'error', title: 'Invalid Admin', background: '#0f172a', color: '#fff' });
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function showApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            fetchData();
        }

        // DATABASE OPERATIONS
        async function fetchData() {
            try {
                const res = await fetch(DATABASE_URL);
                store = await res.json();
                refreshUI();
            } catch(e) { 
                Swal.fire('Error', 'Failed to connect database!', 'error'); 
            }
        }

        function refreshUI() {
            const grid = document.getElementById('userGrid');
            const users = store.auth_database || [];
            grid.innerHTML = "";

            // Stats
            document.getElementById('statTotal').innerText = users.length;
            document.getElementById('statActive').innerText = users.filter(u => u.status === 'active').length;
            document.getElementById('statLife').innerText = users.filter(u => u.status === 'lifetime').length;
            document.getElementById('statBlock').innerText = users.filter(u => u.status === 'blocked').length;
            
            // Navbar
            document.getElementById('appLogo').src = store.app_config.logo_url;
            document.getElementById('appTitle').innerText = store.app_config.title;

            users.forEach((user, idx) => {
                const isLife = user.status === 'lifetime';
                const sColor = isLife ? 'text-amber-400 bg-amber-400/10' : (user.status === 'blocked' ? 'text-red-400 bg-red-400/10' : 'text-emerald-400 bg-emerald-400/10');
                
                const card = `
                    <div class="premium-card p-6 relative group overflow-hidden ${isLife ? 'lifetime-glow' : ''}">
                        ${isLife ? '<div class="absolute -right-6 -top-6 w-16 h-16 bg-amber-500 rotate-45 flex items-end justify-center pb-1"><i class="fas fa-crown text-white text-xs"></i></div>' : ''}
                        
                        <div class="flex justify-between items-start mb-5">
                            <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter ${sColor}">${user.status}</span>
                            <div class="flex gap-3">
                                <button onclick="openEditor(${idx})" class="text-blue-400 hover:text-white transition"><i class="fas fa-user-edit"></i></button>
                                <button onclick="deleteUser(${idx})" class="text-red-500 hover:text-white transition"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">Device ID</p>
                                <p class="font-mono text-white text-sm truncate">${user.device_id}</p>
                            </div>
                            <div class="flex justify-between items-end gap-2">
                                <div class="flex-1 overflow-hidden">
                                    <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Security Key</p>
                                    <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
                                        <p class="text-[11px] font-mono text-blue-300 truncate">${user.key}</p>
                                        <button onclick="copyToClipboard('${user.key}', this)" class="text-slate-500 hover:text-emerald-400 transition-all"><i class="fas fa-copy"></i></button>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Expires</p>
                                    <p class="text-xs font-bold ${isLife ? 'text-amber-500' : 'text-slate-300'}">${isLife ? 'UNLIMITED' : user.expiry}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // CRUD HELPERS
        function openEditor(idx = -1) {
            editingIndex = idx;
            const modal = document.getElementById('userModal');
            document.getElementById('modalTitle').innerText = idx === -1 ? 'Provision New Device' : 'Override User Protocol';
            
            if(idx !== -1) {
                const u = store.auth_database[idx];
                document.getElementById('m_device').value = u.device_id;
                document.getElementById('m_status').value = u.status;
                document.getElementById('m_key').value = u.key;
                document.getElementById('m_expiry').value = u.expiry === 'unlimited' ? '' : u.expiry;
            } else {
                document.querySelectorAll('#userModal input').forEach(i => i.value = "");
                document.getElementById('m_status').value = 'active';
            }
            checkStatus();
            modal.classList.remove('hidden');
        }

        function checkStatus() {
            const s = document.getElementById('m_status').value;
            const exp = document.getElementById('m_expiry');
            if(s === 'lifetime') { exp.disabled = true; exp.style.opacity = '0.3'; }
            else { exp.disabled = false; exp.style.opacity = '1'; }
        }

        async function processSave() {
            const s = document.getElementById('m_status').value;
            const obj = {
                device_id: document.getElementById('m_device').value || "ANY",
                status: s,
                expiry: s === 'lifetime' ? 'unlimited' : document.getElementById('m_expiry').value,
                key: document.getElementById('m_key').value || "GEN-KEY-" + Math.random().toString(36).substr(2, 5).toUpperCase()
            };

            if(editingIndex === -1) store.auth_database.push(obj);
            else store.auth_database[editingIndex] = obj;

            await syncData();
            closeModal();
        }

        async function deleteUser(idx) {
            const res = await Swal.fire({
                title: 'Terminate Access?',
                text: "This action cannot be undone!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                background: '#0f172a', color: '#fff'
            });
            if(res.isConfirmed) {
                store.auth_database.splice(idx, 1);
                await syncData();
            }
        }

        async function saveConfigs() {
            store.app_config.title = document.getElementById('c_title').value;
            store.app_config.logo_url = document.getElementById('c_logo').value;
            store.app_config.buy_url = document.getElementById('c_buy').value;
            store.global_config.global_key_enabled = document.getElementById('c_global_on').checked;
            store.global_config.global_key = document.getElementById('c_global_key').value;
            store.global_config.global_instruction = document.getElementById('c_global_msg').value;
            
            await syncData();
            switchView('close');
        }

        async function syncData() {
            Swal.fire({ title: 'Syncing...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const response = await fetch(DATABASE_URL, { method: 'PUT', body: JSON.stringify(store) });
                if(response.ok) {
                    Swal.fire({ icon: 'success', title: 'Intelligence Synced!', timer: 1000, showConfirmButton: false });
                    refreshUI();
                }
            } catch(e) { Swal.fire('Error', 'Synchronization Failed', 'error'); }
        }

        // UI HELPERS
        function closeModal() { document.getElementById('userModal').classList.add('hidden'); }
        
        function switchView(mode) {
            const m = document.getElementById('configModal');
            if(mode === 'config') {
                document.getElementById('c_title').value = store.app_config.title;
                document.getElementById('c_logo').value = store.app_config.logo_url;
                document.getElementById('c_buy').value = store.app_config.buy_url;
                document.getElementById('c_global_on').checked = store.global_config.global_key_enabled;
                document.getElementById('c_global_key').value = store.global_config.global_key;
                document.getElementById('c_global_msg').value = store.global_config.global_instruction;
                m.classList.remove('hidden');
            } else m.classList.add('hidden');
        }

        function filterCards() {
            const val = document.getElementById('searchBox').value.toLowerCase();
            const cards = document.querySelectorAll('#userGrid > div');
            cards.forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(val) ? 'block' : 'none';
            });
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text);
            const icon = btn.querySelector('i');
            icon.classList.remove('fa-copy');
            icon.classList.add('fa-check', 'copy-success');
            setTimeout(() => {
                icon.classList.remove('fa-check', 'copy-success');
                icon.classList.add('fa-copy');
            }, 1500);
        }
    </script>
</body>
</html>
