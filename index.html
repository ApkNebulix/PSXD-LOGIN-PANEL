<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PSXD ULTIMATE ADMIN PANEL</title>
    <style>
        /* --- পিওর সিএসএস এবং ডিজাইন --- */
        :root {
            --bg: #050505;
            --surface: #121212;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #007bff;
            --accent-glow: rgba(0, 123, 255, 0.4);
            --success: #00ff88;
            --danger: #ff4444;
            --warning: #ffaa00;
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }

        /* --- ব্যাকগ্রাউন্ড গ্রাডিয়েন্ট --- */
        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 10%, #001a33, transparent),
                        radial-gradient(circle at 90% 90%, #1a0033, transparent);
            z-index: -1;
        }

        /* --- লগইন পেজ --- */
        #loginPage {
            position: fixed; inset: 0; z-index: 1000; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
        }
        .login-card {
            width: 100%; max-width: 350px; background: var(--surface); padding: 40px 25px;
            border-radius: 30px; border: 1px solid var(--border); text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- ড্যাশবোর্ড মেইন UI --- */
        #mainApp { display: none; height: 100vh; flex-direction: column; }

        header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(10,10,10,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
        }

        /* --- কন্টেন্ট এরিয়া (Scrollable) --- */
        main { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .view { display: none; }
        .view.active { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- কার্ড ডিজাইন --- */
        .card {
            background: var(--surface); border-radius: 20px; padding: 20px;
            border: 1px solid var(--border); margin-bottom: 15px; position: relative;
            transition: 0.3s;
        }
        .card:active { transform: scale(0.98); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .badge-active { background: rgba(0, 255, 136, 0.1); color: var(--success); }
        .badge-lifetime { background: rgba(255, 170, 0, 0.1); color: var(--warning); border: 1px solid var(--warning); }
        .badge-blocked { background: rgba(255, 68, 68, 0.1); color: var(--danger); }

        .key-row { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .key-text { font-family: monospace; color: var(--accent); font-size: 13px; }

        /* --- ইনপুট ফিল্ড --- */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 5px; font-weight: bold; }
        .field { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid var(--border); border-radius: 12px; color: white; outline: none; }
        .field:focus { border-color: var(--accent); }

        /* --- ট্যাব নেভিগেশন (Mobile Style) --- */
        .tab-bar {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: rgba(20,20,20,0.9); backdrop-filter: blur(20px);
            border-radius: 25px; border: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 500;
        }
        .tab-item { display: flex; flex-direction: column; align-items: center; color: var(--text-dim); font-size: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-item.active { color: var(--accent); transform: translateY(-5px); }
        .tab-icon { margin-bottom: 4px; }

        /* --- বাটন --- */
        .btn { padding: 15px 25px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 5px 15px var(--accent-glow); }
        .btn-danger { background: rgba(255, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }

        /* --- সার্চ বার --- */
        .search-area { margin-bottom: 20px; position: relative; }
        .search-field { width: 100%; padding: 15px 20px 15px 45px; background: var(--surface); border: 1px solid var(--border); border-radius: 15px; color: white; }

        /* --- মডাল/এডিটর --- */
        #editorModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .editor-content { background: var(--surface); width: 100%; max-width: 400px; padding: 30px; border-radius: 30px; border: 1px solid var(--border); }

        /* --- টোস্ট নোটিফিকেশন --- */
        #toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 12px 25px; border-radius: 50px; font-size: 12px; font-weight: bold; display: none; z-index: 5000; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <div id="toast">সফলভাবে আপডেট হয়েছে!</div>

    <!-- লগইন স্ক্রিন -->
    <div id="loginPage">
        <div class="login-card">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#007bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <h2 style="margin: 20px 0;">ADMIN SECURE</h2>
            <input type="password" id="admPass" class="field" placeholder="পাসওয়ার্ড দিন" style="text-align: center; margin-bottom: 20px;">
            <button onclick="checkAuth()" class="btn btn-primary" style="width: 100%;">প্রবেশ করুন</button>
        </div>
    </div>

    <!-- ড্যাশবোর্ড অ্যাপ -->
    <div id="mainApp">
        <header>
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="headLogo" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);">
                <div>
                    <h1 id="headTitle" style="font-size: 16px;">PANEL</h1>
                    <span style="font-size: 9px; color: var(--success); font-weight: bold; letter-spacing: 1px;">SYNC ACTIVE</span>
                </div>
            </div>
            <button onclick="logout()" class="btn btn-danger" style="padding: 10px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button>
        </header>

        <main id="viewContainer">
            
            <!-- ট্যাব ১: ইউজার লিস্ট -->
            <div id="tab-users" class="view active">
                <div class="search-area">
                    <svg style="position: absolute; left: 15px; top: 15px;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" class="search-field" placeholder="ID বা Key দিয়ে সার্চ করুন..." oninput="handleSearch()">
                </div>
                <div id="userGrid">
                    <!-- কার্ড লোড হবে -->
                </div>
            </div>

            <!-- ট্যাব ২: নতুন ইউজার -->
            <div id="tab-add" class="view">
                <div class="card" style="margin-top: 20px;">
                    <h3 style="margin-bottom: 20px;">নতুন ইউজার যুক্ত করুন</h3>
                    <div class="input-group">
                        <label>DEVICE ID</label>
                        <input type="text" id="n_id" class="field uppercase" placeholder="XD-0000">
                    </div>
                    <div class="input-group">
                        <label>STATUS</label>
                        <select id="n_status" class="field" onchange="toggleDate('n_expiry', this.value)">
                            <option value="active">Active</option>
                            <option value="lifetime">Lifetime</option>
                            <option value="blocked">Blocked</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>EXPIRY DATE</label>
                        <input type="date" id="n_expiry" class="field">
                    </div>
                    <div class="input-group">
                        <label>LOGIN KEY</label>
                        <input type="text" id="n_key" class="field" placeholder="SHIMUL-PRO-XXXX">
                    </div>
                    <button onclick="addNewUser()" class="btn btn-primary" style="width: 100%; margin-top: 10px;">ডাটাবেসে যুক্ত করুন</button>
                </div>
            </div>

            <!-- ট্যাব ৩: কনফিগ -->
            <div id="tab-config" class="view">
                <div class="card">
                    <h3>App Config</h3>
                    <div class="input-group"><label>BUY URL</label><input id="c_buy" class="field"></div>
                    <div class="input-group"><label>LOGO URL</label><input id="c_logo" class="field"></div>
                    <div class="input-group"><label>TITLE</label><input id="c_title" class="field"></div>
                </div>
                <div class="card">
                    <h3>Global Config</h3>
                    <div class="input-group" style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Global Key Enable</label>
                        <input type="checkbox" id="c_gl_on" style="width: 25px; height: 25px;">
                    </div>
                    <div class="input-group"><label>Global Key</label><input id="c_gl_key" class="field"></div>
                    <div class="input-group"><label>Instruction</label><textarea id="c_gl_msg" class="field" style="height: 80px;"></textarea></div>
                </div>
                <button onclick="saveSystemConfig()" class="btn btn-primary" style="width: 100%; margin-bottom: 50px;">সব আপডেট করুন</button>
            </div>

            <!-- ট্যাব ৪: পরিসংখ্যান -->
            <div id="tab-stats" class="view">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px;">
                    <div class="card" style="text-align: center;"><p style="font-size: 10px; color: var(--text-dim);">TOTAL</p><h2 id="s_total" style="font-size: 30px; color: var(--accent);">0</h2></div>
                    <div class="card" style="text-align: center;"><p style="font-size: 10px; color: var(--text-dim);">ACTIVE</p><h2 id="s_active" style="font-size: 30px; color: var(--success);">0</h2></div>
                    <div class="card" style="text-align: center;"><p style="font-size: 10px; color: var(--text-dim);">LIFETIME</p><h2 id="s_life" style="font-size: 30px; color: var(--warning);">0</h2></div>
                    <div class="card" style="text-align: center;"><p style="font-size: 10px; color: var(--text-dim);">BLOCKED</p><h2 id="s_block" style="font-size: 30px; color: var(--danger);">0</h2></div>
                </div>
            </div>

        </main>

        <!-- ট্যাব বার -->
        <div class="tab-bar">
            <div class="tab-item active" onclick="switchTab('users', this)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 00-3-3.87"></path><path d="M16 3.13a4 4 0 010 7.75"></path></svg>
                <span>ইউজার</span>
            </div>
            <div class="tab-item" onclick="switchTab('add', this)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span>যুক্ত করুন</span>
            </div>
            <div class="tab-item" onclick="switchTab('config', this)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
                <span>সেটিংস</span>
            </div>
            <div class="tab-item" onclick="switchTab('stats', this)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <span>রিপোর্ট</span>
            </div>
        </div>
    </div>

    <!-- মডাল এডিটর (ইউজার এডিট এর জন্য) -->
    <div id="editorModal">
        <div class="editor-content">
            <h2 style="margin-bottom: 25px;">ইউজার এডিট করুন</h2>
            <div class="input-group">
                <label>DEVICE ID</label>
                <input type="text" id="e_id" class="field uppercase">
            </div>
            <div class="input-group">
                <label>STATUS</label>
                <select id="e_status" class="field" onchange="toggleDate('e_expiry', this.value)">
                    <option value="active">Active</option>
                    <option value="lifetime">Lifetime</option>
                    <option value="blocked">Blocked</option>
                </select>
            </div>
            <div class="input-group">
                <label>EXPIRY DATE</label>
                <input type="date" id="e_expiry" class="field">
            </div>
            <div class="input-group">
                <label>LOGIN KEY</label>
                <input type="text" id="e_key" class="field">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="document.getElementById('editorModal').style.display='none'" class="btn btn-danger" style="flex: 1;">বাতিল</button>
                <button onclick="updateUserRecord()" class="btn btn-primary" style="flex: 2;">সেভ করুন</button>
            </div>
        </div>
    </div>

    <script>
        // --- মূল সিস্টেম কোড ---
        const FIREBASE_URL = "https://onedevicekeysxd-default-rtdb.firebaseio.com/psxd_loginkey_onedevice.json";
        const APP_PASSWORD = "123"; // পরিবর্তন করতে পারো

        let database = null;
        let currentEditIdx = -1;

        // ভেরিফিকেশন
        function checkAuth() {
            const p = document.getElementById('admPass').value;
            if(p === APP_PASSWORD) {
                localStorage.setItem('psxd_login', 'true');
                startApp();
            } else { alert("ভুল পাসওয়ার্ড!"); }
        }

        window.onload = () => {
            if(localStorage.getItem('psxd_login') === 'true') startApp();
        };

        function logout() { localStorage.clear(); location.reload(); }

        // অ্যাপ শুরু
        async function startApp() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            await loadData();
        }

        // ডাটা লোড
        async function loadData() {
            try {
                const res = await fetch(FIREBASE_URL);
                database = await res.json();
                renderUI();
            } catch(e) { showNotify("সার্ভার ইরর!"); }
        }

        // UI রেন্ডার
        function renderUI() {
            const grid = document.getElementById('userGrid');
            const data = database.auth_database || [];
            grid.innerHTML = "";

            // পরিসংখ্যান আপডেট
            document.getElementById('s_total').innerText = data.length;
            document.getElementById('s_active').innerText = data.filter(u => u.status === 'active').length;
            document.getElementById('s_life').innerText = data.filter(u => u.status === 'lifetime').length;
            document.getElementById('s_block').innerText = data.filter(u => u.status === 'blocked').length;

            // ব্রান্ডিং আপডেট
            document.getElementById('headLogo').src = database.app_config.logo_url;
            document.getElementById('headTitle').innerText = database.app_config.title;

            // কার্ড রেন্ডার (Newest First - unshift logic handled in add function)
            data.forEach((user, i) => {
                const isLife = user.status === 'lifetime';
                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge badge-${user.status}">${user.status}</span>
                        <div style="display:flex; gap:12px;">
                            <button onclick="editModal(${i})" style="background:none; border:none; color:var(--accent);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                            <button onclick="deleteNode(${i})" style="background:none; border:none; color:var(--danger);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg></button>
                        </div>
                    </div>
                    <div style="margin-bottom:10px;">
                        <p style="font-size:10px; color:var(--text-dim); margin-bottom:2px;">IDENTITY</p>
                        <p style="font-weight:bold; font-family:monospace; font-size:14px;">${user.device_id}</p>
                    </div>
                    <div class="key-row">
                        <span class="key-text">${user.key}</span>
                        <button onclick="copyText('${user.key}')" style="background:none; border:none; color:var(--text-dim);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg></button>
                    </div>
                    <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); pt:10px;">
                        <div>
                            <p style="font-size:9px; color:var(--text-dim);">EXPIRY</p>
                            <p style="font-size:11px; font-weight:bold; color:${isLife ? 'var(--warning)' : 'white'}">${isLife ? '∞ UNLIMITED' : user.expiry}</p>
                        </div>
                        ${isLife ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="var(--warning)"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>' : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ট্যাব সুইচ
        function switchTab(tabId, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('tab-'+tabId).classList.add('active');
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            if(tabId === 'config') {
                document.getElementById('c_buy').value = database.app_config.buy_url;
                document.getElementById('c_logo').value = database.app_config.logo_url;
                document.getElementById('c_title').value = database.app_config.title;
                document.getElementById('c_gl_on').checked = database.global_config.global_key_enabled;
                document.getElementById('c_gl_key').value = database.global_config.global_key;
                document.getElementById('c_gl_msg').value = database.global_config.global_instruction;
            }
        }

        // রিয়েল টাইম সার্চ
        function handleSearch() {
            const v = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(v) ? 'block' : 'none';
            });
        }

        // নতুন ইউজার যোগ (Newest First)
        async function addNewUser() {
            const status = document.getElementById('n_status').value;
            const obj = {
                device_id: document.getElementById('n_id').value || "ANY",
                status: status,
                expiry: status === 'lifetime' ? 'unlimited' : document.getElementById('n_expiry').value,
                key: document.getElementById('n_key').value
            };
            if(!obj.key) return alert("Key অবশ্যই দিতে হবে!");
            
            database.auth_database.unshift(obj); // তালিকার প্রথমে যোগ করা
            await sync();
            showNotify("ইউজার যুক্ত হয়েছে!");
            switchTab('users', document.querySelector('.tab-item'));
        }

        // এডিট মডাল
        function editModal(idx) {
            currentEditIdx = idx;
            const u = database.auth_database[idx];
            document.getElementById('e_id').value = u.device_id;
            document.getElementById('e_status').value = u.status;
            document.getElementById('e_key').value = u.key;
            document.getElementById('e_expiry').value = u.expiry === 'unlimited' ? '' : u.expiry;
            toggleDate('e_expiry', u.status);
            document.getElementById('editorModal').style.display = 'flex';
        }

        async function updateUserRecord() {
            const s = document.getElementById('e_status').value;
            database.auth_database[currentEditIdx] = {
                device_id: document.getElementById('e_id').value,
                status: s,
                expiry: s === 'lifetime' ? 'unlimited' : document.getElementById('e_expiry').value,
                key: document.getElementById('e_key').value
            };
            await sync();
            document.getElementById('editorModal').style.display = 'none';
        }

        // ডিলিট
        async function deleteNode(idx) {
            if(confirm("ইউজারটি মুছে ফেলতে চান?")) {
                database.auth_database.splice(idx, 1);
                await sync();
            }
        }

        // কনফিগ সেভ
        async function saveSystemConfig() {
            database.app_config.buy_url = document.getElementById('c_buy').value;
            database.app_config.logo_url = document.getElementById('c_logo').value;
            database.app_config.title = document.getElementById('c_title').value;
            database.global_config.global_key_enabled = document.getElementById('c_gl_on').checked;
            database.global_config.global_key = document.getElementById('c_gl_key').value;
            database.global_config.global_instruction = document.getElementById('c_gl_msg').value;
            await sync();
        }

        // ফায়ারবেস সিঙ্ক (PUT Method - 100% Reliable)
        async function sync() {
            showNotify("ডাটাবেস সিঙ্ক হচ্ছে...");
            try {
                const res = await fetch(FIREBASE_URL, {
                    method: 'PUT',
                    body: JSON.stringify(database)
                });
                if(res.ok) {
                    showNotify("সাফল্যের সাথে সেভ হয়েছে!");
                    renderUI();
                }
            } catch(e) { showNotify("সিঙ্ক ব্যর্থ হয়েছে!"); }
        }

        // ইউটিলিটি ফাংশনস
        function toggleDate(elId, val) {
            const el = document.getElementById(elId);
            if(val === 'lifetime') { el.disabled = true; el.style.opacity = '0.3'; el.value = ''; }
            else { el.disabled = false; el.style.opacity = '1'; }
        }

        function copyText(t) {
            navigator.clipboard.writeText(t);
            showNotify("কী কপি হয়েছে!");
        }

        function showNotify(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

    </script>
</body>
</html>
