<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSXD CYBER PANEL - ULTIMATE PRO</title>
    <style>
        /* --- পিওর সিএসএস ভেরিয়েবলস --- */
        :root {
            --bg: #030712;
            --glass: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- ব্যাকগ্রাউন্ড এনিমেশন --- */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, #1e1b4b, transparent),
                        radial-gradient(circle at 0% 100%, #020617, transparent);
            z-index: -1;
        }

        /* --- কমন ইউটিলিটি --- */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }

        .btn {
            cursor: pointer; padding: 12px 24px; border-radius: 12px;
            border: none; font-weight: 600; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 8px; color: white;
        }
        .btn-primary { background: var(--accent); box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        /* --- লগইন সেকশন --- */
        #loginScreen {
            position: fixed; inset: 0; z-index: 1000; background: var(--bg);
            display: flex; align-items: center; justify-center; padding: 20px;
        }
        .login-box {
            width: 100%; max-width: 400px; padding: 40px; border-radius: 30px; text-align: center;
        }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; font-weight: bold; }
        .input-field {
            width: 100%; padding: 15px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border); border-radius: 12px; color: white; outline: none;
        }
        .input-field:focus { border-color: var(--accent); }

        /* --- ড্যাশবোর্ড --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; border-radius: 20px; margin-bottom: 30px;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img { width: 50px; height: 50px; border-radius: 15px; border: 1px solid var(--border); }

        /* --- স্ট্যাটাস কার্ড --- */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 40px;
        }
        .stat-card { padding: 25px; border-radius: 20px; text-align: center; }
        .stat-card h3 { font-size: 32px; margin-top: 10px; }
        .stat-card p { font-size: 12px; color: var(--text-dim); text-transform: uppercase; }

        /* --- অ্যাকশন বার --- */
        .action-bar {
            display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between;
            align-items: center; margin-bottom: 30px;
        }
        .search-box {
            flex: 1; min-width: 300px; position: relative;
        }
        .search-box input {
            width: 100%; padding: 15px 50px; border-radius: 15px; background: var(--glass);
            border: 1px solid var(--border); color: white; outline: none;
        }

        /* --- ইউজার কার্ডস --- */
        .user-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }
        .user-card {
            padding: 30px; border-radius: 28px; position: relative;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }
        .user-card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .badge {
            padding: 4px 12px; border-radius: 8px; font-size: 10px; font-weight: bold;
            text-transform: uppercase;
        }
        .badge-active { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .badge-lifetime { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid var(--warning); }
        .badge-blocked { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .card-body h4 { font-size: 11px; color: var(--text-dim); margin-bottom: 5px; }
        .card-body p { font-family: monospace; font-size: 15px; margin-bottom: 15px; word-break: break-all; }
        
        .key-box {
            background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* --- মডাল --- */
        .modal {
            position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            width: 100%; max-width: 550px; padding: 40px; border-radius: 30px;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }

        /* --- নোটিফিকেশন --- */
        .toast {
            position: fixed; bottom: 20px; right: 20px; padding: 15px 30px;
            border-radius: 12px; background: var(--accent); color: white;
            z-index: 3000; display: none; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        /* মোবাইল রেসপন্সিভ */
        @media (max-width: 600px) {
            .action-bar { flex-direction: column; }
            .search-box { min-width: 100%; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- লগইন সেকশন -->
    <div id="loginScreen">
        <div class="login-box glass">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <h2 style="margin: 20px 0;">ADMIN TERMINAL</h2>
            <div class="input-group">
                <label>ADMIN EMAIL</label>
                <input type="email" id="email" class="input-field" placeholder="email@example.com">
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="pass" class="input-field" placeholder="••••••••">
            </div>
            <button onclick="auth()" class="btn btn-primary" style="width: 100%;">AUTHORIZE ACCESS</button>
        </div>
    </div>

    <!-- মেইন ড্যাশবোর্ড -->
    <div id="app" style="display: none;">
        <div class="container">
            <header class="glass">
                <div class="logo-area">
                    <img id="navLogo" class="logo-img" src="">
                    <div>
                        <h2 id="navTitle" style="font-size: 18px;">DASHBOARD</h2>
                        <span style="font-size: 10px; color: var(--accent); font-weight: bold;">SECURITY PROTOCOL ACTIVE</span>
                    </div>
                </div>
                <button onclick="logout()" class="btn btn-danger" style="padding: 10px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </header>

            <!-- স্ট্যাটাস -->
            <div class="stats-grid">
                <div class="stat-card glass" style="border-bottom: 3px solid var(--accent);">
                    <p>Total Nodes</p>
                    <h3 id="st-total">0</h3>
                </div>
                <div class="stat-card glass" style="border-bottom: 3px solid var(--success);">
                    <p>Active</p>
                    <h3 id="st-active">0</h3>
                </div>
                <div class="stat-card glass" style="border-bottom: 3px solid var(--warning);">
                    <p>Lifetime</p>
                    <h3 id="st-life">0</h3>
                </div>
                <div class="stat-card glass" style="border-bottom: 3px solid var(--danger);">
                    <p>Blocked</p>
                    <h3 id="st-block">0</h3>
                </div>
            </div>

            <!-- টুলস -->
            <div class="action-bar">
                <div class="search-box">
                    <div style="position: absolute; left: 15px; top: 15px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                    <input type="text" id="search" placeholder="Search by ID, Key, or Status..." oninput="filterData()">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="openConfig()" class="btn glass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path></svg></button>
                    <button onclick="openEditor()" class="btn btn-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> NEW NODE</button>
                </div>
            </div>

            <!-- ইউজার গ্রিড -->
            <div id="userGrid" class="user-grid">
                <!-- ডাইনামিক কার্ড -->
            </div>
        </div>
    </div>

    <!-- ইউজার মডাল -->
    <div id="userModal" class="modal">
        <div class="modal-content glass">
            <h2 id="modalTitle" style="margin-bottom: 30px;">MANAGE PROTOCOL</h2>
            <div class="input-group">
                <label>DEVICE IDENTITY</label>
                <input type="text" id="m-device" class="input-field uppercase">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="input-group">
                    <label>STATUS</label>
                    <select id="m-status" class="input-field" onchange="toggleExp()">
                        <option value="active">Active</option>
                        <option value="lifetime">Lifetime</option>
                        <option value="blocked">Blocked</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>EXPIRY DATE</label>
                    <input type="date" id="m-expiry" class="input-field">
                </div>
            </div>
            <div class="input-group">
                <label>SECURITY KEY</label>
                <input type="text" id="m-key" class="input-field">
            </div>
            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button onclick="closeModal()" class="btn glass" style="flex: 1;">CANCEL</button>
                <button onclick="saveUser()" class="btn btn-primary" style="flex: 2;">AUTHORIZE SAVE</button>
            </div>
        </div>
    </div>

    <!-- কনফিগ মডাল -->
    <div id="configModal" class="modal">
        <div class="modal-content glass" style="max-width: 700px;">
            <h2 style="margin-bottom: 30px; color: var(--accent);">SYSTEM CORE SETTINGS</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <div class="input-group"><label>APP TITLE</label><input id="c-title" class="input-field"></div>
                    <div class="input-group"><label>LOGO URL</label><input id="c-logo" class="input-field"></div>
                    <div class="input-group"><label>BUY URL</label><input id="c-buy" class="input-field"></div>
                </div>
                <div>
                    <div class="input-group" style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px;">
                        <label style="margin:0;">GLOBAL KEY ACCESS</label>
                        <input type="checkbox" id="c-gl-on" style="width: 20px; height: 20px;">
                    </div>
                    <div class="input-group"><label>GLOBAL KEY</label><input id="c-gl-key" class="input-field"></div>
                    <div class="input-group"><label>INSTRUCTION</label><textarea id="c-gl-msg" class="input-field" style="height: 80px;"></textarea></div>
                </div>
            </div>
            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button onclick="document.getElementById('configModal').style.display='none'" class="btn glass" style="flex: 1;">CLOSE</button>
                <button onclick="saveConfig()" class="btn btn-primary" style="flex: 2;">SYNC SETTINGS</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Action Success!</div>

    <script>
        // --- কনফিগারেশন ---
        const DB_URL = "https://onedevicekeysxd-default-rtdb.firebaseio.com/psxd_loginkey_onedevice.json";
        const ADMIN = { user: "admin@psxd.com", pass: "shimulxd" };

        let store = null;
        let editIdx = -1;

        // অথেনটিকেশন
        function auth() {
            const u = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            if(u === ADMIN.user && p === ADMIN.pass) {
                localStorage.setItem('psxd_auth', 'true');
                init();
            } else { alert("Invalid Credentials!"); }
        }

        window.onload = () => {
            if(localStorage.getItem('psxd_auth')) init();
        };

        function logout() { localStorage.clear(); location.reload(); }

        // ডাটাবেস লোড
        async function init() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            try {
                const res = await fetch(DB_URL);
                store = await res.json();
                render();
            } catch(e) { showToast("Failed to load DB!"); }
        }

        // রেন্ডার সিস্টেম
        function render() {
            const grid = document.getElementById('userGrid');
            const data = store.auth_database || [];
            grid.innerHTML = "";

            // পরিসংখ্যান
            document.getElementById('st-total').innerText = data.length;
            document.getElementById('st-active').innerText = data.filter(x => x.status === 'active').length;
            document.getElementById('st-life').innerText = data.filter(x => x.status === 'lifetime').length;
            document.getElementById('st-block').innerText = data.filter(x => x.status === 'blocked').length;

            // ব্রান্ডিং
            document.getElementById('navLogo').src = store.app_config.logo_url;
            document.getElementById('navTitle').innerText = store.app_config.title;

            data.forEach((u, i) => {
                const isLife = u.status === 'lifetime';
                const card = document.createElement('div');
                card.className = `user-card glass ${isLife ? 'badge-lifetime' : ''}`;
                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge badge-${u.status}">${u.status}</span>
                        <div style="display:flex; gap:10px;">
                            <button onclick="openEditor(${i})" style="background:none; border:none; cursor:pointer; color:#3b82f6;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                            <button onclick="del(${i})" style="background:none; border:none; cursor:pointer; color:#ef4444;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg></button>
                        </div>
                    </div>
                    <div class="card-body">
                        <h4>NODE IDENTITY</h4>
                        <p>${u.device_id}</p>
                        <h4>SECURITY KEY</h4>
                        <div class="key-box">
                            <span style="font-size:12px; color:#3b82f6;">${u.key}</span>
                            <button onclick="copy('${u.key}')" style="background:none; border:none; cursor:pointer; color:#666;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg></button>
                        </div>
                        <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <h4 style="margin:0;">EXPIRES</h4>
                                <b style="font-size:12px; color:${isLife ? '#f59e0b' : '#eee'}">${isLife ? '∞ LIFETIME' : u.expiry}</b>
                            </div>
                            ${isLife ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="#f59e0b"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>' : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // CRUD ফাংশন
        function openEditor(idx = -1) {
            editIdx = idx;
            document.getElementById('modalTitle').innerText = idx === -1 ? "PROVISION NEW NODE" : "MODIFY PROTOCOL";
            if(idx !== -1) {
                const u = store.auth_database[idx];
                document.getElementById('m-device').value = u.device_id;
                document.getElementById('m-status').value = u.status;
                document.getElementById('m-key').value = u.key;
                document.getElementById('m-expiry').value = u.expiry === 'unlimited' ? '' : u.expiry;
            } else {
                document.querySelectorAll('#userModal input').forEach(i => i.value = "");
                document.getElementById('m-status').value = "active";
            }
            toggleExp();
            document.getElementById('userModal').style.display = 'flex';
        }

        function toggleExp() {
            const isLife = document.getElementById('m-status').value === 'lifetime';
            const exp = document.getElementById('m-expiry');
            exp.disabled = isLife;
            exp.style.opacity = isLife ? '0.2' : '1';
        }

        async function saveUser() {
            const s = document.getElementById('m-status').value;
            const obj = {
                device_id: document.getElementById('m-device').value || "ANY",
                status: s,
                expiry: s === 'lifetime' ? 'unlimited' : document.getElementById('m-expiry').value,
                key: document.getElementById('m_key').value || ("KEY-" + Math.random().toString(36).substr(2, 6).toUpperCase())
            };

            if(editIdx === -1) store.auth_database.unshift(obj);
            else store.auth_database[editIdx] = obj;

            await sync();
            closeModal();
        }

        async function del(idx) {
            if(confirm("Terminate this node?")) {
                store.auth_database.splice(idx, 1);
                await sync();
            }
        }

        async function sync() {
            showToast("Syncing Database...");
            try {
                await fetch(DB_URL, { method: 'PUT', body: JSON.stringify(store) });
                showToast("Synchronization Success!");
                render();
            } catch(e) { showToast("Sync Failed!"); }
        }

        // ইউটিলিটি
        function closeModal() { document.getElementById('userModal').style.display = 'none'; }
        function copy(t) { navigator.clipboard.writeText(t); showToast("Key Copied!"); }
        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function filterData() {
            const v = document.getElementById('search').value.toLowerCase();
            const cards = document.querySelectorAll('.user-card');
            cards.forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(v) ? 'block' : 'none';
            });
        }

        function openConfig() {
            document.getElementById('c-title').value = store.app_config.title;
            document.getElementById('c-logo').value = store.app_config.logo_url;
            document.getElementById('c-buy').value = store.app_config.buy_url;
            document.getElementById('c-gl-on').checked = store.global_config.global_key_enabled;
            document.getElementById('c-gl-key').value = store.global_config.global_key;
            document.getElementById('c-gl-msg').value = store.global_config.global_instruction;
            document.getElementById('configModal').style.display = 'flex';
        }

        async function saveConfig() {
            store.app_config.title = document.getElementById('c-title').value;
            store.app_config.logo_url = document.getElementById('c-logo').value;
            store.app_config.buy_url = document.getElementById('c_buy').value;
            store.global_config.global_key_enabled = document.getElementById('c-gl-on').checked;
            store.global_config.global_key = document.getElementById('c-gl-key').value;
            store.global_config.global_instruction = document.getElementById('c-gl-msg').value;
            await sync();
            document.getElementById('configModal').style.display = 'none';
        }
    </script>
</body>
</html>
