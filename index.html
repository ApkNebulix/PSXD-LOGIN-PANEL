<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSXD CYBER PANEL PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap');
        
        :root {
            --accent: #3b82f6;
            --glass: rgba(15, 23, 42, 0.8);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Outfit', 'Hind Siliguri', sans-serif;
            background: #020617;
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Animation */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(125deg, #020617, #0f172a, #1e1b4b, #020617);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            z-index: -1;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-morphism {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .user-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.3), rgba(15, 23, 42, 0.5));
            border-radius: 28px;
            border: 1px solid var(--border);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            transform: scale(1.02) translateY(-5px);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        .lifetime-glow {
            border: 1px solid rgba(245, 158, 11, 0.3);
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.05), rgba(15, 23, 42, 0.5));
        }

        .lifetime-glow::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .custom-input {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid var(--border) !important;
            color: white !important;
            transition: 0.3s;
        }
        .custom-input:focus { border-color: var(--accent) !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* Floating Button for Mobile */
        .fab-btn {
            position: fixed; bottom: 2rem; right: 2rem;
            width: 65px; height: 65px; border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex; items-center; justify-center;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
            z-index: 50; cursor: pointer; transition: 0.3s;
        }
        .fab-btn:hover { transform: scale(1.1) rotate(90deg); }
    </style>
</head>
<body>

    <div class="bg-animate"></div>

    <!-- LOGIN SHIELD -->
    <div id="loginSection" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="glass-morphism p-10 rounded-[40px] w-full max-w-md animate__animated animate__zoomIn">
            <div class="text-center mb-10">
                <div class="w-24 h-24 bg-blue-600/20 rounded-[30px] flex items-center justify-center mx-auto mb-6 relative">
                    <i class="fas fa-fingerprint text-5xl text-blue-500"></i>
                    <div class="absolute inset-0 border-2 border-blue-500/30 rounded-[30px] animate-pulse"></div>
                </div>
                <h1 class="text-3xl font-black text-white tracking-tight">SYSTEM ACCESS</h1>
                <p class="text-slate-400 mt-2 text-sm">Please verify your admin identity</p>
            </div>
            <div class="space-y-6">
                <input type="email" id="l_email" class="w-full custom-input p-5 rounded-2xl outline-none" placeholder="Admin Email">
                <input type="password" id="l_pass" class="w-full custom-input p-5 rounded-2xl outline-none" placeholder="Secure Password">
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-5 rounded-2xl shadow-2xl transition active:scale-95">Access Terminal</button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardSection" class="hidden min-h-screen">
        
        <!-- Header -->
        <header class="sticky top-0 z-40 p-6 flex justify-between items-center glass-morphism border-b border-white/5 mb-8">
            <div class="flex items-center gap-5">
                <div class="relative">
                    <img id="navLogo" class="w-14 h-14 rounded-2xl object-cover border border-white/10 shadow-xl">
                    <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-[#020617] rounded-full"></div>
                </div>
                <div>
                    <h2 id="navTitle" class="text-2xl font-black text-white leading-none">PSXD ADMIN</h2>
                    <span class="text-[10px] text-blue-400 font-bold uppercase tracking-[0.2em]">Authorized Access Only</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openConfig()" class="p-3 glass-morphism rounded-xl text-slate-400 hover:text-white transition">
                    <i class="fas fa-sliders text-lg"></i>
                </button>
                <button onclick="logout()" class="p-3 bg-red-500/10 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition">
                    <i class="fas fa-power-off text-lg"></i>
                </button>
            </div>
        </header>

        <div class="max-w-7xl mx-auto px-6">
            <!-- Analytics Cards -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                <div class="glass-morphism p-6 rounded-3xl border-l-4 border-blue-500">
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Total Nodes</p>
                    <h3 id="st_total" class="text-3xl font-black mt-1">0</h3>
                </div>
                <div class="glass-morphism p-6 rounded-3xl border-l-4 border-emerald-500">
                    <p class="text-[10px] font-bold text-emerald-500 uppercase">Verified</p>
                    <h3 id="st_active" class="text-3xl font-black mt-1">0</h3>
                </div>
                <div class="glass-morphism p-6 rounded-3xl border-l-4 border-amber-500">
                    <p class="text-[10px] font-bold text-amber-500 uppercase">Elite Status</p>
                    <h3 id="st_life" class="text-3xl font-black mt-1">0</h3>
                </div>
                <div class="glass-morphism p-6 rounded-3xl border-l-4 border-red-500">
                    <p class="text-[10px] font-bold text-red-500 uppercase">Terminated</p>
                    <h3 id="st_block" class="text-3xl font-black mt-1">0</h3>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="flex flex-col md:flex-row gap-5 mb-10 items-center justify-between">
                <div class="relative w-full md:w-[450px] group">
                    <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-blue-500 transition"></i>
                    <input type="text" id="searchBar" oninput="liveSearch()" onpaste="liveSearch()" class="w-full glass-morphism py-5 pl-14 pr-6 rounded-[25px] outline-none text-sm tracking-wide" placeholder="Search by Node ID, License or Status...">
                </div>
                <div class="flex gap-4 w-full md:w-auto">
                    <button onclick="fetchData()" class="p-5 glass-morphism rounded-2xl hover:bg-slate-800 transition"><i class="fas fa-sync-alt"></i></button>
                    <button onclick="openEditor()" class="flex-1 md:flex-none px-10 py-5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-xl shadow-blue-600/20 flex items-center justify-center gap-3"><i class="fas fa-plus"></i> NEW NODE</button>
                </div>
            </div>

            <!-- User Grid -->
            <div id="userContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-24 animate__animated animate__fadeInUp">
                <!-- Data will load here -->
            </div>
        </div>
    </div>

    <!-- MODAL: EDITOR -->
    <div id="editModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-black/90 backdrop-blur-xl p-4">
        <div class="glass-morphism w-full max-w-xl p-10 rounded-[40px] animate__animated animate__zoomIn">
            <h2 id="modalTitle" class="text-3xl font-black mb-10 text-white">MANAGE NODE</h2>
            <div class="space-y-6">
                <div>
                    <label class="text-xs font-bold text-slate-500 ml-2 uppercase">Target Identity (Device ID)</label>
                    <input id="m_device" class="w-full custom-input p-5 rounded-2xl mt-2 font-mono uppercase tracking-widest">
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="text-xs font-bold text-slate-500 ml-2 uppercase">Privilege Level</label>
                        <select id="m_status" onchange="toggleDate()" class="w-full custom-input p-5 rounded-2xl mt-2">
                            <option value="active">Active</option>
                            <option value="lifetime">Lifetime</option>
                            <option value="blocked">Blocked</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 ml-2 uppercase">Expiry Timeline</label>
                        <input type="date" id="m_expiry" class="w-full custom-input p-5 rounded-2xl mt-2">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 ml-2 uppercase">Cyber Key (License)</label>
                    <input id="m_key" class="w-full custom-input p-5 rounded-2xl mt-2 font-mono text-blue-400">
                </div>
            </div>
            <div class="flex gap-5 mt-12">
                <button onclick="closeModal()" class="flex-1 p-5 rounded-2xl font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 transition">Discard</button>
                <button onclick="saveChanges()" class="flex-[2] p-5 rounded-2xl font-bold bg-blue-600 text-white shadow-xl shadow-blue-600/20 active:scale-95 transition">Authorize Update</button>
            </div>
        </div>
    </div>

    <!-- MODAL: APP CONFIG -->
    <div id="configModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-black/90 backdrop-blur-2xl p-4">
        <div class="glass-morphism w-full max-w-3xl p-10 rounded-[40px] max-h-[90vh] overflow-y-auto">
            <h2 class="text-3xl font-black mb-10 flex items-center gap-4 text-white"><i class="fas fa-terminal text-blue-500"></i> SYSTEM CORE SETTINGS</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-6">
                    <h4 class="font-bold text-blue-400 border-b border-white/5 pb-3 uppercase tracking-widest text-xs">Primary Config</h4>
                    <input id="c_title" placeholder="App Title" class="w-full custom-input p-4 rounded-xl">
                    <input id="c_logo" placeholder="Logo Link" class="w-full custom-input p-4 rounded-xl">
                    <input id="c_buy" placeholder="Purchase Link" class="w-full custom-input p-4 rounded-xl">
                </div>
                <div class="space-y-6">
                    <h4 class="font-bold text-emerald-400 border-b border-white/5 pb-3 uppercase tracking-widest text-xs">Broadcast Config</h4>
                    <div class="flex items-center justify-between p-4 glass-morphism rounded-xl">
                        <span class="text-sm font-bold text-slate-300">Global Switch</span>
                        <input type="checkbox" id="c_gl_on" class="w-6 h-6 accent-blue-500">
                    </div>
                    <input id="c_gl_key" placeholder="Global Access Key" class="w-full custom-input p-4 rounded-xl">
                    <textarea id="c_gl_msg" placeholder="Global Announcement Message..." rows="3" class="w-full custom-input p-4 rounded-xl"></textarea>
                </div>
            </div>
            <div class="flex gap-5 mt-12">
                <button onclick="document.getElementById('configModal').classList.add('hidden')" class="flex-1 p-5 rounded-2xl bg-slate-800 font-bold">Back</button>
                <button onclick="saveSystem()" class="flex-[2] p-5 rounded-2xl bg-emerald-600 text-white font-bold shadow-xl shadow-emerald-600/20">Apply Protocol</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONSTANTS ---
        const DB_ENDPOINT = "https://onedevicekeysxd-default-rtdb.firebaseio.com/psxd_loginkey_onedevice.json";
        const ADM_USER = "admin@psxd.com"; // Edit this
        const ADM_PASS = "shimulxd";      // Edit this

        let appData = null;
        let activeIdx = -1;

        // AUTH GUARD
        window.onload = () => {
            if(localStorage.getItem('session_active') === 'true') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                fetchData();
            }
        };

        function handleLogin() {
            const e = document.getElementById('l_email').value;
            const p = document.getElementById('l_pass').value;
            if(e === ADM_USER && p === ADM_PASS) {
                localStorage.setItem('session_active', 'true');
                location.reload();
            } else {
                Swal.fire({ icon: 'error', title: 'ACCESS DENIED', text: 'Unauthorized identity detected!', background: '#020617', color: '#fff' });
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        // DATABASE OPS
        async function fetchData() {
            try {
                const res = await fetch(DB_ENDPOINT);
                appData = await res.json();
                renderCards();
            } catch(e) { Swal.fire('Error', 'Database Offline', 'error'); }
        }

        function renderCards() {
            const grid = document.getElementById('userContainer');
            const users = [...(appData.auth_database || [])]; // Reverse copy for "Newest First" logic if needed
            grid.innerHTML = "";

            // Statistics Update
            document.getElementById('st_total').innerText = users.length;
            document.getElementById('st_active').innerText = users.filter(u => u.status === 'active').length;
            document.getElementById('st_life').innerText = users.filter(u => u.status === 'lifetime').length;
            document.getElementById('st_block').innerText = users.filter(u => u.status === 'blocked').length;
            
            // Branding Update
            document.getElementById('navLogo').src = appData.app_config.logo_url;
            document.getElementById('navTitle').innerText = appData.app_config.title;

            users.forEach((user, i) => {
                const isLife = user.status === 'lifetime';
                const sColor = isLife ? 'text-amber-400 bg-amber-400/10' : (user.status === 'blocked' ? 'text-red-500 bg-red-500/10' : 'text-emerald-400 bg-emerald-400/10');
                
                const cardHtml = `
                    <div class="user-card p-8 group ${isLife ? 'lifetime-glow' : ''}">
                        <div class="flex justify-between items-start mb-8">
                            <div class="flex items-center gap-3">
                                <div class="w-3 h-3 rounded-full ${user.status === 'blocked' ? 'bg-red-500' : 'bg-emerald-500'} shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div>
                                <span class="text-[11px] font-black uppercase tracking-widest ${sColor} px-3 py-1 rounded-lg">${user.status}</span>
                            </div>
                            <div class="flex gap-4 opacity-40 group-hover:opacity-100 transition-opacity">
                                <button onclick="openEditor(${i})" class="text-blue-400 hover:text-white"><i class="fas fa-pen-nib text-lg"></i></button>
                                <button onclick="removeNode(${i})" class="text-red-500 hover:text-white"><i class="fas fa-trash-alt text-lg"></i></button>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div>
                                <div class="flex justify-between items-end mb-2">
                                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">NODE IDENTITY</p>
                                    <button onclick="copy('${user.device_id}', this)" class="text-[10px] text-slate-600 hover:text-blue-400 transition"><i class="fas fa-copy"></i></button>
                                </div>
                                <p class="font-mono text-white text-lg font-bold truncate tracking-widest">${user.device_id}</p>
                            </div>

                            <div>
                                <div class="flex justify-between items-end mb-2">
                                    <p class="text-[10px] font-bold text-slate-500 uppercase">ACCESS KEY</p>
                                    <button onclick="copy('${user.key}', this)" class="text-[10px] text-slate-600 hover:text-emerald-400 transition"><i class="fas fa-link"></i></button>
                                </div>
                                <div class="bg-slate-950/80 p-3 rounded-xl border border-white/5 font-mono text-[11px] text-blue-300 truncate tracking-wider">${user.key}</div>
                            </div>

                            <div class="pt-4 border-t border-white/5 flex justify-between items-center">
                                <div>
                                    <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">VALID UNTIL</p>
                                    <p class="text-xs font-black ${isLife ? 'text-amber-500' : 'text-slate-200'}">${isLife ? '<i class="fas fa-infinity mr-1"></i> ELITE LIFETIME' : user.expiry}</p>
                                </div>
                                ${isLife ? '<i class="fas fa-crown text-amber-500 text-xl drop-shadow-[0_0_8px_rgba(245,158,11,0.5)]"></i>' : ''}
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // ACTIONS
        function openEditor(idx = -1) {
            activeIdx = idx;
            document.getElementById('modalTitle').innerText = idx === -1 ? "DEPLOY NEW NODE" : "MODIFY PROTOCOL";
            if(idx !== -1) {
                const u = appData.auth_database[idx];
                document.getElementById('m_device').value = u.device_id;
                document.getElementById('m_status').value = u.status;
                document.getElementById('m_key').value = u.key;
                document.getElementById('m_expiry').value = u.expiry === 'unlimited' ? '' : u.expiry;
            } else {
                document.querySelectorAll('#editModal input').forEach(i => i.value = "");
                document.getElementById('m_status').value = 'active';
            }
            toggleDate();
            document.getElementById('editModal').classList.remove('hidden');
        }

        function toggleDate() {
            const isLife = document.getElementById('m_status').value === 'lifetime';
            const exp = document.getElementById('m_expiry');
            exp.disabled = isLife;
            exp.style.opacity = isLife ? '0.2' : '1';
        }

        async function saveChanges() {
            const s = document.getElementById('m_status').value;
            const nodeObj = {
                device_id: document.getElementById('m_device').value || "ANY",
                status: s,
                expiry: s === 'lifetime' ? 'unlimited' : document.getElementById('m_expiry').value,
                key: document.getElementById('m_key').value || ("KEY-" + Math.random().toString(36).substr(2, 6).toUpperCase())
            };

            if(activeIdx === -1) {
                appData.auth_database.unshift(nodeObj); // Add to the TOP
            } else {
                appData.auth_database[activeIdx] = nodeObj;
            }

            await sync();
            closeModal();
        }

        async function removeNode(idx) {
            const confirm = await Swal.fire({
                title: 'TERMINATE NODE?',
                text: "Access will be permanently revoked!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                background: '#020617', color: '#fff'
            });
            if(confirm.isConfirmed) {
                appData.auth_database.splice(idx, 1);
                await sync();
            }
        }

        async function saveSystem() {
            appData.app_config.title = document.getElementById('c_title').value;
            appData.app_config.logo_url = document.getElementById('c_logo').value;
            appData.app_config.buy_url = document.getElementById('c_buy').value;
            appData.global_config.global_key_enabled = document.getElementById('c_gl_on').checked;
            appData.global_config.global_key = document.getElementById('c_gl_key').value;
            appData.global_config.global_instruction = document.getElementById('c_gl_msg').value;
            await sync();
            document.getElementById('configModal').classList.add('hidden');
        }

        async function sync() {
            Swal.fire({ title: 'Syncing Data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const res = await fetch(DB_ENDPOINT, { method: 'PUT', body: JSON.stringify(appData) });
                if(res.ok) {
                    Swal.fire({ icon: 'success', title: 'SYNC SUCCESS', timer: 1000, showConfirmButton: false, background: '#020617' });
                    renderCards();
                }
            } catch(e) { Swal.fire('Error', 'Sync Failure!', 'error'); }
        }

        // UTILS
        function liveSearch() {
            // Enhanced search that runs on input or paste instantly
            setTimeout(() => {
                const val = document.getElementById('searchBar').value.toLowerCase();
                const cards = document.querySelectorAll('#userContainer > div');
                cards.forEach(c => {
                    c.style.display = c.innerText.toLowerCase().includes(val) ? 'block' : 'none';
                });
            }, 10);
        }

        function copy(text, btn) {
            navigator.clipboard.writeText(text);
            const icon = btn.querySelector('i');
            icon.classList.replace('fa-copy', 'fa-check');
            icon.classList.replace('fa-link', 'fa-check');
            setTimeout(() => {
                icon.classList.replace('fa-check', 'fa-copy');
                icon.classList.replace('fa-check', 'fa-link');
            }, 1500);
        }

        function closeModal() { document.getElementById('editModal').classList.add('hidden'); }
        
        function openConfig() {
            document.getElementById('c_title').value = appData.app_config.title;
            document.getElementById('c_logo').value = appData.app_config.logo_url;
            document.getElementById('c_buy').value = appData.app_config.buy_url;
            document.getElementById('c_gl_on').checked = appData.global_config.global_key_enabled;
            document.getElementById('c_gl_key').value = appData.global_config.global_key;
            document.getElementById('c_gl_msg').value = appData.global_config.global_instruction;
            document.getElementById('configModal').classList.remove('hidden');
        }
    </script>
</body>
</html>
