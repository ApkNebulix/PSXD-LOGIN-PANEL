<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSXD ULTIMATE ADMIN PANEL PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Inter', 'Hind Siliguri', sans-serif; background: #010409; color: #c9d1d9; }
        .glass-card { background: rgba(22, 27, 34, 0.9); border: 1px solid #30363d; border-radius: 16px; transition: all 0.3s ease; }
        .premium-border { border: 1px solid transparent; background: linear-gradient(#161b22, #161b22) padding-box, linear-gradient(135deg, #3b82f6, #8b5cf6) border-box; }
        .status-active { color: #3fb950; background: rgba(63, 185, 80, 0.1); }
        .status-lifetime { color: #d29922; background: rgba(210, 153, 34, 0.1); border: 1px solid #d29922; }
        .status-blocked { color: #f85149; background: rgba(248, 81, 73, 0.1); }
        .loader-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#0d1117] p-4">
        <div class="glass-card p-8 w-full max-w-md shadow-2xl premium-border text-center">
            <div class="mb-6 inline-flex p-4 bg-blue-600/20 rounded-2xl">
                <i class="fas fa-lock-open text-3xl text-blue-500"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">Admin Panel Access</h1>
            <p class="text-slate-400 text-sm mb-6">নিচে আপনার লগইন তথ্য দিন</p>
            <div class="space-y-4">
                <input type="email" id="adm_email" placeholder="Email Address" class="w-full p-4 bg-[#0d1117] border border-[#30363d] rounded-xl outline-none focus:border-blue-500 transition">
                <input type="password" id="adm_pass" placeholder="Password" class="w-full p-4 bg-[#0d1117] border border-[#30363d] rounded-xl outline-none focus:border-blue-500 transition">
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition">লগইন করুন</button>
            </div>
        </div>
    </div>

    <!-- MAIN PANEL -->
    <div id="mainContent" class="hidden">
        <nav class="sticky top-0 z-50 bg-[#0d1117]/80 backdrop-blur-md border-b border-[#30363d] px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">P</div>
                <h2 class="text-xl font-bold text-white tracking-tight">PSXD ADMIN</h2>
            </div>
            <button onclick="logout()" class="text-red-400 hover:bg-red-500/10 px-4 py-2 rounded-lg font-bold transition">লগআউট</button>
        </nav>

        <div class="max-w-7xl mx-auto px-4 mt-8">
            <!-- Global Config Card -->
            <div class="glass-card p-6 mb-8 border-l-4 border-blue-500 animate__animated animate__fadeInDown">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                    <h3 class="font-bold text-white flex items-center gap-2"><i class="fas fa-cog text-blue-400"></i> Global Settings</h3>
                    <div class="flex items-center gap-2 bg-slate-800 p-1 px-3 rounded-full text-xs">
                        <span>Global Key:</span>
                        <input type="checkbox" id="gl_key_enabled" class="w-4 h-4 cursor-pointer">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="gl_key" placeholder="Global Free Key" class="bg-[#0d1117] p-3 border border-[#30363d] rounded-lg">
                    <input id="gl_instruction" placeholder="Global Instruction message..." class="bg-[#0d1117] p-3 border border-[#30363d] rounded-lg">
                </div>
                <button onclick="saveAllConfig()" class="mt-4 bg-emerald-600 hover:bg-emerald-700 px-6 py-2 rounded-lg font-bold text-white transition flex items-center gap-2">
                    <i class="fas fa-save"></i> সেটিংস সেভ করুন
                </button>
            </div>

            <!-- Header -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-white">ইউজার লিস্ট</h1>
                    <p class="text-slate-500 text-sm" id="userCountDisplay">মোট ইউজার: লোড হচ্ছে...</p>
                </div>
                <button onclick="openModal()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20">
                    <i class="fas fa-user-plus"></i> নতুন ইউজার
                </button>
            </div>

            <!-- User Cards Grid -->
            <div id="userGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Data will injected here -->
            </div>
        </div>
    </div>

    <!-- USER MODAL -->
    <div id="userModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="glass-card w-full max-w-lg p-8 premium-border">
            <h2 id="modalTitle" class="text-xl font-bold text-white mb-6">ইউজার ডাটা এডিট করুন</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-500 uppercase font-bold">Device ID</label>
                    <input id="m_device" class="w-full p-3 mt-1 bg-[#0d1117] border border-[#30363d] rounded-lg outline-none uppercase font-mono">
                </div>
                <div>
                    <label class="text-xs text-slate-500 uppercase font-bold">Status</label>
                    <select id="m_status" onchange="toggleDateInput()" class="w-full p-3 mt-1 bg-[#0d1117] border border-[#30363d] rounded-lg outline-none">
                        <option value="active">Active</option>
                        <option value="lifetime">Lifetime</option>
                        <option value="blocked">Blocked</option>
                    </select>
                </div>
                <div id="expiryContainer">
                    <label class="text-xs text-slate-500 uppercase font-bold">Expiry Date</label>
                    <input type="date" id="m_expiry" class="w-full p-3 mt-1 bg-[#0d1117] border border-[#30363d] rounded-lg outline-none">
                </div>
                <div>
                    <label class="text-xs text-slate-500 uppercase font-bold">License Key</label>
                    <input id="m_key" class="w-full p-3 mt-1 bg-[#0d1117] border border-[#30363d] rounded-lg outline-none font-mono">
                </div>
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="closeModal()" class="flex-1 bg-[#21262d] py-3 rounded-xl font-bold">বাতিল</button>
                <button onclick="saveUser()" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold shadow-lg shadow-blue-500/20">সেভ করুন</button>
            </div>
        </div>
    </div>

    <script>
        // --- configuration ---
        const DB_URL = "https://onedevicekeysxd-default-rtdb.firebaseio.com/psxd_loginkey_onedevice.json";
        const ADM_EMAIL = "admin@psxd.com"; // এখানে ইমেইল পরিবর্তন করতে পারো
        const ADM_PASS = "123456";         // এখানে পাসওয়ার্ড পরিবর্তন করতে পারো

        let fullData = null;
        let activeEditIndex = -1;

        // Login System
        function handleLogin() {
            const email = document.getElementById('adm_email').value;
            const pass = document.getElementById('adm_pass').value;
            if(email === ADM_EMAIL && pass === ADM_PASS) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                fetchDatabase();
            } else {
                Swal.fire({ icon: 'error', title: 'ভুল তথ্য!', text: 'সঠিক ইমেইল ও পাসওয়ার্ড দিন', background: '#0d1117', color: '#fff' });
            }
        }

        function logout() { location.reload(); }

        // Fetch Data
        async function fetchDatabase() {
            try {
                const res = await fetch(DB_URL);
                fullData = await res.json();
                renderUI();
            } catch(e) {
                Swal.fire('Error', 'ডাটাবেস কানেকশন ফেইলড!', 'error');
            }
        }

        function renderUI() {
            const grid = document.getElementById('userGrid');
            const authDB = fullData.auth_database || [];
            grid.innerHTML = "";

            document.getElementById('userCountDisplay').innerText = `মোট ইউজার: ${authDB.length}`;
            
            // Sync Config Fields
            document.getElementById('gl_key_enabled').checked = fullData.global_config.global_key_enabled;
            document.getElementById('gl_key').value = fullData.global_config.global_key;
            document.getElementById('gl_instruction').value = fullData.global_config.global_instruction;

            authDB.forEach((u, index) => {
                const isLifetime = u.status === 'lifetime';
                const statusClass = isLifetime ? 'status-lifetime' : (u.status === 'blocked' ? 'status-blocked' : 'status-active');
                
                const card = `
                    <div class="glass-card p-6 relative group hover:premium-border animate__animated animate__fadeIn">
                        <div class="flex justify-between items-start mb-4">
                            <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider ${statusClass}">
                                ${u.status}
                            </span>
                            <div class="flex gap-3">
                                <button onclick="openModal(${index})" class="text-blue-400 hover:text-white transition"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteUser(${index})" class="text-red-400 hover:text-white transition"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Device Identity</p>
                        <h4 class="font-mono text-white text-sm truncate mb-4">${u.device_id}</h4>
                        
                        <div class="grid grid-cols-2 gap-4 border-t border-[#30363d] pt-4">
                            <div>
                                <p class="text-[10px] text-slate-500 font-bold uppercase">Expiry Date</p>
                                <p class="text-xs font-bold ${isLifetime ? 'text-amber-500' : 'text-slate-300'}">
                                    ${isLifetime ? '∞ UNLIMITED' : u.expiry}
                                </p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] text-slate-500 font-bold uppercase">License Key</p>
                                <p class="text-[10px] font-mono bg-[#30363d] px-2 py-1 rounded inline-block truncate max-w-full">${u.key}</p>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // Modal Logic
        function openModal(index = -1) {
            activeEditIndex = index;
            const modal = document.getElementById('userModal');
            document.getElementById('modalTitle').innerText = index === -1 ? 'নতুন ইউজার যোগ করুন' : 'ইউজার ডাটা এডিট';
            
            if(index !== -1) {
                const u = fullData.auth_database[index];
                document.getElementById('m_device').value = u.device_id;
                document.getElementById('m_status').value = u.status;
                document.getElementById('m_key').value = u.key;
                document.getElementById('m_expiry').value = u.expiry === 'unlimited' ? '' : u.expiry;
            } else {
                document.querySelectorAll('#userModal input').forEach(i => i.value = "");
                document.getElementById('m_status').value = 'active';
            }
            toggleDateInput();
            modal.classList.remove('hidden');
        }

        function toggleDateInput() {
            const isLifetime = document.getElementById('m_status').value === 'lifetime';
            document.getElementById('expiryContainer').style.display = isLifetime ? 'none' : 'block';
        }

        function closeModal() { document.getElementById('userModal').classList.add('hidden'); }

        // Core Update Function
        async function syncWithFirebase() {
            Swal.fire({
                title: 'Updating Database...',
                html: '<i class="fas fa-sync loader-spin text-3xl text-blue-500"></i>',
                allowOutsideClick: false,
                showConfirmButton: false,
                background: '#0d1117',
                color: '#fff'
            });

            try {
                const response = await fetch(DB_URL, {
                    method: 'PUT', // এটি পুরো জেসন ফাইলটিকে ওভাররাইট করবে
                    body: JSON.stringify(fullData)
                });

                if(response.ok) {
                    Swal.fire({ icon: 'success', title: 'সাফল্যের সাথে আপডেট হয়েছে!', timer: 1500, showConfirmButton: false, background: '#0d1117' });
                    renderUI();
                } else {
                    throw new Error("Update Failed");
                }
            } catch(e) {
                Swal.fire({ 
                    icon: 'error', 
                    title: 'ফেইলড!', 
                    text: 'Firebase Rules চেক করুন। .write true আছে কিনা দেখুন।',
                    background: '#0d1117', 
                    color: '#fff' 
                });
            }
        }

        async function saveUser() {
            const status = document.getElementById('m_status').value;
            const userObj = {
                device_id: document.getElementById('m_device').value || "ANY",
                status: status,
                expiry: status === 'lifetime' ? 'unlimited' : document.getElementById('m_expiry').value,
                key: document.getElementById('m_key').value || "GENERATED-KEY"
            };

            if(activeEditIndex === -1) {
                fullData.auth_database.push(userObj);
            } else {
                fullData.auth_database[activeEditIndex] = userObj;
            }
            
            closeModal();
            await syncWithFirebase();
        }

        async function deleteUser(index) {
            const confirm = await Swal.fire({
                title: 'মুছে ফেলতে চান?',
                text: "ইউজার ডাটা চিরতরে হারিয়ে যাবে!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#f85149',
                background: '#0d1117',
                color: '#fff'
            });

            if(confirm.isConfirmed) {
                fullData.auth_database.splice(index, 1);
                await syncWithFirebase();
            }
        }

        async function saveAllConfig() {
            fullData.global_config.global_key_enabled = document.getElementById('gl_key_enabled').checked;
            fullData.global_config.global_key = document.getElementById('gl_key').value;
            fullData.global_config.global_instruction = document.getElementById('gl_instruction').value;
            await syncWithFirebase();
        }

    </script>
</body>
</html>
